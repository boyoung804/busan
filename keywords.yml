# 선별·분류 규칙. 이 파일만 고치면 코드 수정 없이 선별 결과가 바뀝니다.
# 과거 보고서와 비교하며 계속 다듬으세요. (제목에 걸리면 x2, 본문 앞 400자에 걸리면 x1)

threshold: 6            # 이 점수 이상만 보고서 후보
cluster_similarity: 0.25  # 같은 사안으로 묶는 제목 유사도 (낮출수록 더 많이 묶임)
summary_max_chars: 200  # 요약 최대 글자수

page_bonus: {"1면": 2, "2면": 1, "3면": 1}

# 키워드: 가중치
weights:
  부산시장: 4
  전재수: 4
  부산시: 3
  부시장: 3
  시의회: 3
  시의원: 3
  시정: 3
  정무: 3
  추경: 3
  추가경정: 3
  민생: 2
  협치: 2
  임용: 2
  지원사업: 2
  북항: 3
  가덕신공항: 3
  해양수도: 3
  해수부: 3
  해양수산부: 3
  북극항로: 3
  유엔해양총회: 3
  HMM: 3
  부산상의: 3
  부산상공회의소: 3
  광역교통: 3
  동남권: 2
  부울경: 3
  전통시장: 2
  소상공인: 2

# 제목에 있으면 감점 (시 관련 키워드가 함께 있으면 상쇄됨)
exclude:
  penalty: 4
  words: [야구, 축구, 농구, 배구, 연예, 드라마, 화재, 교통사고, 폭행, 음주운전, 부고, 인사말]

# 섹션 분류 키워드 (많이 걸린 섹션 선택, 동점이면 위쪽 우선, 없으면 사회 일반)
sections:
  시청·시의회: [부산시, 시장, 부시장, 시정, 정무, 임용, 추경, 지원사업, 시청, 산하기관, 공무원]
  정치: [의원, 시의원, 시의회, 민주당, 국민의힘, 국힘, 여야, 의장, 선거, 국회, 정당]
  경제: [상의, 기업, 수출, 항만, 조선, 해운, 금융, HMM, 투자, 산업, 물류, 일자리, 소상공인]

# 키워드가 걸리면 담당부서 표기 (모르면 표기 안 함)
depts:
  해수부: 해양농수산국
  해양수산부: 해양농수산국
  HMM: 해양농수산국
  북극항로: 해양농수산국
  전통시장: 디지털경제실
