name: update-report

on:
  schedule:
    - cron: "*/5 20-23,0 * * *"
  workflow_dispatch:

concurrency:
  group: update-report
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Build report.json
        run: python scripts/build_report.py
      - name: Commit if changed
        run: |
          git config user.name "press-brief-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/report.json data/cache.json
          git diff --cached --quiet || (git commit -m "update $(TZ=Asia/Seoul date +'%F %R')" && git push)
